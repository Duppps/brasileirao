<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="base">
    <head>
        <title th:text="'Gerenciamento de ' + ${entityName}"></title>
    </head>
    <body>
        <section layout:fragment="content">
            <h1 th:text="'Gerenciamento de ' + ${entityName}"></h1>
            <ul class="horizontal-list">
                <li>
                    <button onClick="openModal('create')">Criar</button>
                </li>
                <li>
                    <button>
                        Editar
                    </button>
                </li>
                <li>
                    <button>
                        Excluir
                    </button>
                </li>
            </ul>
            <table>
                <thead>
                <tr>
                    <th th:each="col : ${tableData.columns}" th:text="${col}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${tableData.rows}">
                    <td th:each="col : ${tableData.columns}" th:text="${row[col.toLowerCase()]}"></td>
                </tr>
                </tbody>
            </table>

            <div id="modal" class="modal">
                <div class="modal-content">
                    <h2>Título do Modal</h2>
                    <p>Este é o conteúdo do modal.</p>
                    <button class="close-btn" id="closeModal">Fechar</button>
                </div>
            </div>
            <script th:inline="javascript">
                const modal = document.getElementById('modal');
                const openModalBtn = document.getElementById('openModal');
                const closeModalBtn = document.getElementById('closeModal');

                function openModal(type) {
                    modal.style.display = 'flex';
                }

                closeModalBtn.addEventListener('click', () => {
                    modal.style.display = 'none';
                });

                modal.addEventListener('click', (event) => {
                    if (event.target === modal) {
                        modal.style.display = 'none';
                    }
                });
            </script>
        </section>
    </body>
</html>
