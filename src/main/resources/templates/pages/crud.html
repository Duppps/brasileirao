<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="base">
<head>
    <title th:text="'Gerenciamento de ' + ${entityName}"></title>
</head>
<body>
<section layout:fragment="content">
    <h1 th:text="'Gerenciamento de ' + ${entityName}"></h1>
    <ul class="horizontal-list">
        <li>
            <button onClick="openModal('create')">Criar</button>
        </li>
        <li>
            <button onClick="openModal('edit')">Editar</button>
        </li>
        <li>
            <button onClick="openModal('delete')">Excluir</button>
        </li>
    </ul>
    <table>
        <thead>
        <tr>
            <th th:each="col : ${tableData.columns}" th:text="${col}"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${tableData.rows}">
            <td th:each="col : ${tableData.columns}" th:text="${row[col.toLowerCase()]}"></td>
        </tr>
        </tbody>
    </table>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Título do Modal</h2>
            </div>
            <div id="modalBody">
                <form th:replace="~{fragments/dynamicForm :: form}"></form>
            </div>
            <button class="close-btn" id="closeModal">Fechar</button>
        </div>
    </div>
    <script th:inline="javascript">
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const closeModalBtn = document.getElementById('closeModal');

        function openModal(type) {
            switch (type) {
                case "create":
                    modalTitle.textContent = "Criar Novo Item";
                    break;
                case "edit":
                    modalTitle.textContent = "Editar Item";
                    break;
                case "delete":
                    modalTitle.textContent = "Excluir Item";
                    modalBody.innerHTML = `
                        <p>Tem certeza de que deseja excluir este item?</p>
                        <button>Confirmar</button>
                        <button onClick="closeModal()">Cancelar</button>
                    `;
                    break;
                default:
                    return;
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });
    </script>
</section>
</body>
</html>
